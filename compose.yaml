name: support-triage-copilot

services:
  db:
    image: postgres:17.12-alpine
    environment:
      POSTGRES_DB: triage
      POSTGRES_USER: triage
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-triage-local-only}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No host port: only the app container talks to the database.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U triage -d triage"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    build: .
    image: support-triage-copilot/app:1.0.0
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://triage:${POSTGRES_PASSWORD:-triage-local-only}@db:5432/triage
      TEST_DATABASE_URL: postgresql://triage:${POSTGRES_PASSWORD:-triage-local-only}@db:5432/triage_test
      MODEL_MODE: ${MODEL_MODE:-demo}
    ports:
      - "127.0.0.1:${APP_PORT:-8091}:8000"
    volumes:
      # Evaluation reports written inside the container land in the repository.
      - ./evaluation/results:/app/evaluation/results
    restart: unless-stopped

volumes:
  pgdata:
